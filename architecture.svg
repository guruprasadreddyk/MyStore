  <text x="630" y="382" text-anchor="middle" fill="#64748b" font-size="7.5">Return Mgmt</text>

  <rect x="700" y="340" width="115" height="46" rx="7" fill="#071520" stroke="#06b6d4" stroke-width="1"/>
  <text x="757" y="358" text-anchor="middle" fill="#22d3ee" font-size="9.5" font-weight="700">🚚 Processor</text>
