  <text x="555" y="99" text-anchor="middle" fill="#64748b" font-size="8.5">JWT · Universal Login</text>

  <!-- Arrow 1 -->
  <line x1="450" y1="116" x2="450" y2="138" stroke="#334155" stroke-width="1.5"/>
  <polygon points="450,144 446,137 454,137" fill="#475569"/>
