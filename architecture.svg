  <text x="503" y="382" text-anchor="middle" fill="#64748b" font-size="7.5">Simulation</text>

  <rect x="573" y="340" width="115" height="46" rx="7" fill="#1a0a10" stroke="#f43f5e" stroke-width="1"/>
  <text x="630" y="358" text-anchor="middle" fill="#fb7185" font-size="9.5" font-weight="700">⚙️ Admin</text>
