  <text x="359" y="483" text-anchor="middle" fill="#34d399" font-size="8.5" font-weight="600">wishlist</text>

  <rect x="407" y="466" width="88" height="27" rx="5" fill="#071a14" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="451" y="483" text-anchor="middle" fill="#34d399" font-size="8.5" font-weight="600">user_data</text>

  <rect x="504" y="466" width="78" height="27" rx="5" fill="#071a14" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="543" y="483" text-anchor="middle" fill="#34d399" font-size="8.5" font-weight="600">reviews</text>

  <rect x="591" y="466" width="75" height="27" rx="5" fill="#071a14" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="628" y="483" text-anchor="middle" fill="#34d399" font-size="8.5" font-weight="600">returns</text>

  <!-- Arrow 5 -->
  <line x1="450" y1="502" x2="450" y2="518" stroke="#334155" stroke-width="1.5"/>
  <polygon points="450,524 446,517 454,517" fill="#475569"/>

