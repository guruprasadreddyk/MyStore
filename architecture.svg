  <rect x="290" y="165" width="320" height="30" rx="8" fill="#071520" stroke="#06b6d4" stroke-width="1.2"/>
  <text x="450" y="184" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="700">⚡ CloudFront  →  S3 Bucket</text>

  <!-- Arrow 2 -->
