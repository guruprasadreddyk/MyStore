<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="Segoe UI, system-ui, sans-serif">
  <!-- Background -->
  <rect width="900" height="600" fill="#0f1117" rx="8"/>

  <!-- Title -->
  <text x="450" y="30" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="2">MYSTORE — SYSTEM ARCHITECTURE</text>

  <!-- CLIENT LAYER -->
  <rect x="50" y="48" width="800" height="68" rx="10" fill="none" stroke="#1e3a5f" stroke-width="1.2" stroke-dasharray="5,3"/>
  <text x="70" y="63" fill="#475569" font-size="9" font-weight="700">CLIENT</text>
  <rect x="270" y="66" width="180" height="40" rx="8" fill="#0c1a2e" stroke="#3b82f6" stroke-width="1.2"/>
  <text x="360" y="84" text-anchor="middle" fill="#60a5fa" font-size="11" font-weight="700">🌐 React SPA</text>
  <text x="360" y="99" text-anchor="middle" fill="#64748b" font-size="8.5">React 18 · Router v7 · Auth0 SDK</text>
  <rect x="480" y="66" width="150" height="40" rx="8" fill="#150d24" stroke="#8b5cf6" stroke-width="1.2"/>
