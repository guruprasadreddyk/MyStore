  <rect x="385" y="550" width="140" height="26" rx="6" fill="#071a14" stroke="#10b981" stroke-width="1" stroke-opacity="0.6"/>
  <text x="455" y="567" text-anchor="middle" fill="#34d399" font-size="8.5" font-weight="600">📧 Gmail SMTP (Email)</text>

  <rect x="540" y="550" width="145" height="26" rx="6" fill="#071520" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.6"/>
  <text x="612" y="567" text-anchor="middle" fill="#22d3ee" font-size="8.5" font-weight="600">🔁 SQS (Fulfillment)</text>

  <rect x="700" y="550" width="135" height="26" rx="6" fill="#1a1407" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.6"/>
