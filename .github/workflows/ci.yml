name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint + test ────────────────────────────────────────────────────
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: Install dependencies
        run: pip install boto3 pytest moto

      - name: Run tests
        run: |
          export PYTHONPATH=services
          python -m pytest tests/ -v --tb=short

  # ── Frontend: install + build ───────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          CI: false

  # ── Lambda packages: verify zips build ─────────────────────────────────────
  build-lambdas:
    name: Build Lambda Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Lambda zips
        run: |
          for service in catalog_service user_service order_service payment_service order_processor admin_service; do
            zip -j "${service}_guru.zip" "services/${service}.py" services/utils.py
            echo "✅ ${service}_guru.zip"
          done

      - name: Verify zips exist
        run: ls -lh *_guru.zip
